services:
  # Flask API service
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    container_name: sora_api
    image: sairam76/sora_api
    ports:
      - "5050:5000"
    depends_on:
      - db
    networks:
      - sora_network
 
  # PostgreSQL service (official postgres image)
  db:
    image: postgres:latest  
    container_name: sora_db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./sora_backup.sql:/docker-entrypoint-initdb.d/sora_backup.sql  # Include your SQL file
    ports:
      - "5432:5432"
    networks:
      - sora_network

  # Front-end service (Nginx or static files serving)
  frontend:
    build: 
      context: ./Front_end
      dockerfile: Dockerfile
    container_name: sora_frontend
    image: sairam76/sora_frontend
    ports:
    - "80:80"
    networks:
      - sora_network

networks:
  sora_network:
    driver: bridge  # Use bridge networking for container communication

volumes:
  sora_db_data: